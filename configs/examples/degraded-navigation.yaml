schema_version: "1.0"
id: "example.degraded-navigation.v1"
name: "Benign navigation resilience under sensor and network degradation"
seed: 20260922
clock:
  duration_s: 60.0
  step_s: 0.01
system:
  adapter: "future.px4-gazebo"
faults:
  - id: "FAULT-GNSS-001"
    kind: "sensor_dropout"
    target: "gnss"
    start_time_s: 10.0
    duration_s: 12.0
  - id: "FAULT-NET-001"
    kind: "network_latency"
    target: "telemetry"
    start_time_s: 25.0
    duration_s: 10.0
    parameters:
      latency_ms: 150.0
assertions:
  - id: "REQ-NAV-001"
    metric: "navigation.position_error_m"
    comparator: "<="
    threshold: 3.0
    policy: "all_samples"
  - id: "REQ-OBS-001"
    metric: "telemetry.heartbeat_hz"
    comparator: ">="
    threshold: 5.0
    policy: "all_samples"
